name: Dependency PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

jobs:
  validate-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@10.30.2

      - name: Install dependencies (use lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # If/when you add tests, enable them here:
      # - name: Run tests
      #   run: pnpm test
